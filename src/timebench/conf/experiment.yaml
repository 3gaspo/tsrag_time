stage: prepare
experiment_mode: full
datasets: [all]
terms: [short, medium, long]
excluded_datasets: [Coastal_T_S/5T, current_velocity/20T, azure2019_D/5T, azure2019_I/5T]
dataset_config: null
seed: 0
device: cuda
batch_size: 32
embedding_batch_size: 512
t5_samples: 20
# null uses TIME's per-dataset validation length; 0 disables weight estimation.
validation_length: null
# All historical dates by default. A candidate retains its observed 64-step future.
datastore_stride: 1
max_datastore_windows: null
# The ablation runs the complete 2 x 2 x 2 x 2 grid below.
ablation: false
retrieval:
  scope: all
  aligned: false
  query_scale: false
  representation: t5
retrieval_grid:
  scope: [all, same_series]
  aligned: [false, true]
  query_scale: [false, true]
  representation: [t5, instance_l2]
# Same missing-coordinate policy as Adaptime's lookback L2 retrieval.
minimum_overlap_fraction: 0.8
alignment_period: null
hydra:
  run:
    dir: ${oc.env:TIME_LOGS,logs}/hydra/${now:%Y%m%d_%H%M%S}_${stage}
  job:
    chdir: false
