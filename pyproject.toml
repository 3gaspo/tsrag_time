[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "tsrag-time"
version = "0.1.0"
description = "Independent TS-RAG and Chronos comparison on TIME"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "chronos-forecasting==2.3.1",
    "datasets>=2.17.1,<4",
    "einops>=0.8.0,<1",
    "faiss-cpu>=1.15.0,<2",
    "gluonts==0.16.2",
    "hydra-core>=1.3,<1.4",
    "numpy>=2.1.3,<2.2",
    "omegaconf>=2.3,<2.4",
    "packaging",
    "pandas>=2.2.3,<3",
    "pyarrow",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "toolz",
    "torch>=2.5.1,<2.10",
    "transformers",
]

[project.urls]
Repository = "https://github.com/3gaspo/tsrag_time"

[tool.hatch.build.targets.wheel]
packages = ["src/timebench"]
